<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" font-family="sans-serif" font-size="13">
  <rect x="1" y="1" width="478" height="328" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="240" y="28" text-anchor="middle" font-size="15" fill="#1f2328">Master Node — Control Plane</text>
  <rect x="30" y="42" width="420" height="272" rx="10" fill="#eaf1fb" stroke="#3b6fb0"/>
  <rect x="150" y="66" width="180" height="48" rx="6" fill="#cfe2ff" stroke="#2f5fa0"/>
